<!-- templates/form/identify_student.html کامل -->
{% extends 'form_base.html' %}
{% load static %}

{% block title %}شناسایی دانش‌آموز{% endblock %}

{% block content %}
<style>
    .identify-container {
        max-width: 500px;
        margin: 20px auto;
        padding: 20px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .form-group {
        margin-bottom: 20px;
    }
    .btn-primary {
        width: 100%;
    }

    /* Mobile optimizations */
    @media (max-width: 768px) {
        .identify-container {
            margin: 10px auto;
            padding: 15px;
            border-radius: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        h2 {
            font-size: 20px;
        }
    }
</style>

<div class="identify-container">
    <h2>شناسایی برای آزمون {{ exam.title }}</h2>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="identify" value="1">
        <div class="form-group">
            <label class="form-label">نام</label>
            <input type="text" name="first_name" class="form-control" required>
        </div>
        <div class="form-group">
            <label class="form-label">نام خانوادگی</label>
            <input type="text" name="last_name" class="form-control" required>
        </div>
        <div class="form-group">
            <label class="form-label">شماره کلاسی (اختیاری)</label>
            <input type="number" name="row_number" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">تایید و شروع آزمون</button>
    </form>
</div>
{% endblock %}
